#################################################
#           WATCHER - DOCKER COMPOSE            #
#    Production-ready stack with local build    #
#################################################

name: watcher

services:
  #################################################
  #              REVERSE PROXY (Traefik)          #
  #################################################
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      # Dashboard (optional - disable in production)
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/dynamic:ro
      - ./traefik/logs:/var/log/traefik
      - ./traefik/certs:/etc/private:ro
    environment:
      - DOMAIN_CORP=${DOMAIN_CORP:-example.com}
      - TZ=${TZ:-UTC}
    networks:
      - watcher_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN_CORP:-localhost}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  #################################################
  #              CERTSTREAM SERVER                #
  #################################################
  certstream:
    image: 0rickyy0/certstream-server-go:latest
    container_name: certstream
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./certstream-config.yaml:/app/config.yaml:ro
    environment:
      - TZ=${TZ:-UTC}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    networks:
      - watcher_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      traefik:
        condition: service_healthy

  #################################################
  #              SEARXNG SEARCH ENGINE            #
  #################################################
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    hostname: searxng
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    volumes:
      - ./Searx/searx:/etc/searxng:rw
      - searx_data:/data
    environment:
      - TZ=${TZ:-UTC}
      - BASE_URL=https://${SEARX_HOSTNAME:-searxng.${DOMAIN_CORP:-localhost}}/
      - BIND_ADDRESS=0.0.0.0:8080
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-watcher,certstream,db_watcher}
    networks:
      - watcher_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`searxng.${DOMAIN_CORP:-localhost}`)"
      - "traefik.http.routers.searxng.tls=true"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    depends_on:
      traefik:
        condition: service_healthy

  #################################################
  #              MYSQL DATABASE                   #
  #################################################
  db_watcher:
    image: mysql:8.0
    container_name: db_watcher
    restart: always
    command: >
      mysqld
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
      --max-connections=200
    volumes:
      - db_data:/var/lib/mysql
      - db_logs:/var/log/mysql
    environment:
      - TZ=${TZ:-UTC}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-db_watcher}
      - MYSQL_USER=${DB_USER:-watcher_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-ChangeMeInProduction!}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-ChangeMeInProductionRoot!}
    networks:
      - watcher_network
    healthcheck:
      test: ["CMD", "mysqladmin", "--user=${DB_USER:-watcher_user}", "--password=${DB_PASSWORD:-ChangeMeInProduction!}", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      traefik:
        condition: service_healthy

  #################################################
  #              WATCHER APPLICATION              #
  #################################################
  watcher:
    build:
      context: ./Watcher
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=3.11
        - DEBIAN_SUITE=bookworm
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    container_name: watcher
    restart: always
    tty: true
    ports:
      - "127.0.0.1:9002:9002"
    env_file:
      - ./Watcher/.env
    environment:
      - TZ=${TZ:-UTC}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-searxng,db_watcher,certstream,10.10.10.0/24}
      - DJANGO_SETTINGS_MODULE=Watcher.settings
      - DEBUG=${DEBUG:-False}
    volumes:
      - watcher_static:/app/Watcher/static
      - watcher_logs:/app/Watcher/logs
    networks:
      - watcher_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.watcher.rule=Host(`watcher.${DOMAIN_CORP:-localhost}`)"
      - "traefik.http.routers.watcher.tls=true"
      - "traefik.http.services.watcher.loadbalancer.server.port=9002"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9002/#/login | grep -q 200 || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 12
      start_period: 120s
    depends_on:
      db_watcher:
        condition: service_healthy
      searxng:
        condition: service_started
      certstream:
        condition: service_healthy

#################################################
#                 NETWORKS                      #
#################################################
networks:
  watcher_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.10.10.0/24

#################################################
#                 VOLUMES                       #
#################################################
volumes:
  db_data:
    driver: local
  db_logs:
    driver: local
  searx_data:
    driver: local
  watcher_static:
    driver: local
  watcher_logs:
    driver: local